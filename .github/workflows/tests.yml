name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install --yes lua5.4
      - name: Run deterministic test suite
        run: lua5.4 tests/test_all.lua
