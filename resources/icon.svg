<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
    <defs>
        <!-- Plantilla de estrella de 5 puntas. Usamos stroke-linejoin round para suavizar -->
        <path id="star" d="M 0,-1 L 0.225,-0.309 L 0.951,-0.309 L 0.363,0.118 L 0.588,0.809 L 0,0.382 L -0.588,0.809 L -0.363,0.118 L -0.951,-0.309 L -0.225,-0.309 Z" stroke-linejoin="round" stroke-width="0.4" />
    </defs>

    <!-- Fondo Papirus -->
    <rect x="8" y="8" width="112" height="112" rx="28" fill="#242f3a"/>
    
    <!-- Máscara para la media luna -->
    <mask id="moon-cutout">
        <rect width="128" height="128" fill="white"/>
        <circle cx="76" cy="52" r="26" fill="black"/>
    </mask>

    <!-- Órbita (Lua) - Contraste mejorado -->
    <circle cx="64" cy="64" r="40" fill="none" stroke="#5c7085" stroke-width="2" stroke-dasharray="4 6"/>

    <!-- Luna central (Lua en azul KDE) -->
    <circle cx="64" cy="64" r="30" fill="#1d99f3" mask="url(#moon-cutout)"/>

    <!-- Estrellas satélite redondeadas con colores del logo de KDE Plasma -->
    <!-- Estrella superior (Naranja) -->
    <use href="#star" transform="translate(92, 26) scale(4.0)" fill="#fa8865" stroke="#fa8865"/>
    
    <!-- Estrella medio izquierda (Verde) -->
    <use href="#star" transform="translate(82, 40) scale(5.4)" fill="#63c605" stroke="#63c605"/>
    
    <!-- Estrella inferior derecha (Azul) -->
    <use href="#star" transform="translate(104, 56) scale(7.4)" fill="#1b89f3" stroke="#1b89f3"/>
</svg>
